services:
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    container_name: multimodal-rag-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: multimodal-rag-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: multimodal-rag-postgres
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  dvdrental-postgres:
    image: postgres:16-alpine
    container_name: multimodal-rag-dvdrental-postgres
    environment:
      - POSTGRES_USER=dvdrental
      - POSTGRES_PASSWORD=dvdrental
      - POSTGRES_DB=dvdrental
    ports:
      - "5434:5432"
    volumes:
      - dvdrental-data:/var/lib/postgresql/data
      - ./dvdrental.sql:/seed/dvdrental.sql:ro
      - ./docker/dvdrental-import.sh:/docker-entrypoint-initdb.d/01-dvdrental-import.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dvdrental -d dvdrental"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  huawei-report-postgres:
    image: postgres:16-alpine
    container_name: multimodal-rag-huawei-report-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_pass
      - POSTGRES_DB=huawei_report
    ports:
      - "5435:5432"
    volumes:
      - huawei-report-data:/var/lib/postgresql/data
      - ./docker/huawei_report_schema.sql:/seed/huawei_report_schema.sql:ro
      - ./docker/huawei-report-init.sh:/docker-entrypoint-initdb.d/01-huawei-report-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huawei_report"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: multimodal-rag-backend
    env_file:
      - .env
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - IMAGES_DIR=/app/data/images
      - UPLOADS_DIR=/app/data/uploads
      - DATABASE_URL=postgresql+psycopg2://rag:rag@postgres:5432/rag
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-change-me}
      - REQUIRE_SECURE_JWT_SECRET=${REQUIRE_SECURE_JWT_SECRET:-false}
    ports:
      - "8002:8000"
    volumes:
      - ./data/images:/app/data/images
      - ./data/uploads:/app/data/uploads
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  opensearch-data:
  postgres-data:
  dvdrental-data:
  huawei-report-data:
